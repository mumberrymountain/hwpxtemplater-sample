name: Deploy Frontend to S3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'

jobs:
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Get API Gateway URL from Lambda deployment
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name backend \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' \
            --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API Gateway URL: $API_URL"

      - name: Get S3 bucket from CloudFront Distribution
        id: get-s3-bucket
        run: |
          ORIGIN_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DistributionConfig.Origins.Items[0].DomainName' \
            --output text)
          echo "Origin Domain: $ORIGIN_DOMAIN"
          S3_BUCKET=$(echo "$ORIGIN_DOMAIN" | awk -F'.' '{print $1}')
          echo "Extracted S3 Bucket: $S3_BUCKET"
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT

      - name: Build React app with API URL
        run: yarn build
        env:
          VITE_API_URL: ${{ steps.get-api-url.outputs.api_url }}

      - name: Deploy to S3
        run: |
          if [ -n "${{ steps.get-s3-bucket.outputs.s3_bucket }}" ]; then
            S3_BUCKET="${{ steps.get-s3-bucket.outputs.s3_bucket }}"
          else
            S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          fi
          aws s3 sync dist/ s3://$S3_BUCKET --delete
          aws s3 cp dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

