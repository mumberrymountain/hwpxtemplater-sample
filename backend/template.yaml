AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  backend

  Sample SAM Template for backend

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 20
    Runtime: java17
    Architectures:
      - x86_64
    MemorySize: 512
    CodeUri: functions

Resources:
  BasicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      BinaryMediaTypes:
        - application/hwp+zip
        - application/octet-stream
      Auth:
        ApiKeyRequired: false
      Cors:
        AllowOrigin: "'https://www.hwpxtemplater.link'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowCredentials: false

  # Unified Lambda Function - handles all API endpoints
  UnifiedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.mumberrymountain.UnifiedHandler::handleRequest
      Policies:
        - S3ReadPolicy:
            BucketName: hwpxtemplater-sample-template
      Events:
        # Basic API
        BasicApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /basic
            Method: post
        BasicApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /basic
            Method: options
        # Condition API
        ConditionApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /condition
            Method: post
        ConditionApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /condition
            Method: options
        # Loop API
        LoopApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /loop
            Method: post
        LoopApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /loop
            Method: options
        # Image API
        ImageApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /image
            Method: post
        ImageApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /image
            Method: options
        # Table API
        TableApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /table
            Method: post
        TableApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /table
            Method: options
        # Template API
        TemplateApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /template
            Method: post
        TemplateApiOptionsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BasicApi
            Path: /template
            Method: options

Outputs:
  ApiGatewayUrl:
    Description: "API Gateway Base URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  
  BasicUrl:
    Description: "Basic Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/basic"

  ConditionUrl:
    Description: "Condition Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/condition"

  LoopUrl:
    Description: "Loop Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/loop"

  ImageUrl:
    Description: "Image Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/image"

  TableUrl:
    Description: "Table Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/table"

  TemplateUrl:
    Description: "Template Function URL"
    Value: !Sub "https://${BasicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/template"
